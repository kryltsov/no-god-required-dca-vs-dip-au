.30868162945893" y="200">$52,117 made on $77,500</text><text class="lab" x="110" y="238" text-anchor="end">AAA</text><rect class="fm" x="120" y="224" width="41.06858889692771" height="20" rx="3"><title>AAA: $0.17 made per $1 put in</title></rect><text class="lab" x="169.0685888969277" y="238">$0.17</text><text class="sub" x="208.0685888969277" y="238">$13,351 made on $77,500</text><text class="lab" x="110" y="276" text-anchor="end">IAF</text><rect class="f1" x="120" y="262" width="28.289662115420782" height="20" rx="3"><title>IAF: $0.12 made per $1 put in</title></rect><text class="lab" x="156.28966211542078" y="276">$0.12</text><text class="sub" x="195.28966211542078" y="276">$9,197 made on $77,500</text>
