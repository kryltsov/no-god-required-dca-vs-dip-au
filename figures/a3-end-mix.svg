<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 332" width="920" height="332" role="img" aria-labelledby="t d">
<title id="t">What each portfolio held at the end, against the target</title>
<desc id="d">Stacked bars of the final holdings of VAS, IOO, IEM, IAF and GOLD, and cash, for four strategies against the Topaz target weights.</desc>
<style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#e8e7e3;--mu:#8a8984;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
